services:
  - type: web
    name: zoomly-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/zoom.db
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
    disk:
      name: zoomly-data
      mountPath: /var/data
      sizeGB: 1
